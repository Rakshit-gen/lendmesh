spring:
  application:
    name: lendmesh-api

  datasource:
    url: ${DB_URL:jdbc:h2:mem:lendmesh;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

lendmesh:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-lendmesh-32bytes-minimum}
    expiry-minutes: 720
  simulation:
    tick-interval-ms: ${SIM_TICK_MS:15000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.lendmesh: INFO
